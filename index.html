  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1c1c1e;
      --text-color: #f5f5f7;
      --text-secondary: #aeaee3;
      --accent-color: #0a84ff;
      --danger-color: #ff453a;
      --success-color: #30d158;
      --warning-color: #ffd60a;
      --border-color: #2c2c2e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      box-sizing: border-box;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    header h1 {
      font-size: 20px;
      margin: 0;
      color: var(--accent-color);
      font-weight: 700;
    }

    .history-track {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      min-height: 18px;
      word-wrap: break-word;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      border: 1px solid var(--border-color);
      margin-bottom: auto;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .step-title {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .main-text {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .instruction-box {
      background: rgba(10, 132, 255, 0.08);
      border-left: 4px solid var(--accent-color);
      padding: 14px;
      border-radius: 0 10px 14px 0;
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .instruction-box strong {
      color: var(--accent-color);
    }

    .final-box {
      border-left-color: var(--danger-color);
      background: rgba(255, 69, 58, 0.08);
    }

    .final-box strong {
      color: var(--danger-color);
    }

    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn::after {
      content: "➔";
      font-size: 14px;
      opacity: 0.7;
    }

    .btn:active {
      background-color: #0070e0;
      transform: scale(0.99);
    }

    .btn-danger {
      background-color: var(--danger-color);
    }

    .btn-danger:active {
      background-color: #e03e34;
    }

    .btn-warning {
      background-color: var(--warning-color);
      color: #000;
    }

    .btn-warning::after {
      color: #000;
    }

    .btn-warning:active {
      background-color: #e6be00;
    }

    .footer-buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-footer {
      flex: 1;
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
    }

    .btn-footer:active {
      background-color: var(--border-color);
    }

    .btn-reset-flow {
      border-color: var(--danger-color);
      color: var(--danger-color);
    }

    .btn-reset-flow:active {
      background-color: rgba(255, 69, 58, 0.1);
    }
  </style>
</head>

    let currentStep = 'start';
    let pathHistory = [];

    function renderStep() {
      const step = database[currentStep];
      const card = document.getElementById('flow-card');
      const historyEl = document.getElementById('history');
      const appTitle = document.getElementById('app-title');
      // Меняем заголовок в зависимости от ветки
      if (pathHistory.includes("НЕВА")) {
        appTitle.innerText = "МАИ: Состав «НЕВА» 🚄";
      } else if (pathHistory.includes("ЮБИЛЕЙНЫЙ")) {
        appTitle.innerText = "МАИ: Состав «ЮБИЛЕЙНЫЙ» 🚇";
      } else {
        appTitle.innerText = "Электронная МАИ Машиниста 🚇";
      }
      // Обновляем хлебные крошки (историю пути)
      if (pathHistory.length === 0) {
        historyEl.innerText = "Выбор типа ПСП";
      } else {
        historyEl.innerText = pathHistory.join(" ➔ ");
      }
      let html = '';
      html += < div class = "step-title" > $ {
        step.title
      } < /div>;
      if (step.isInstruction) {
        html += < div class =
          "instruction-box ${step.isFinal ? 'final-box' : ''}" > ;
        html += < strong > $ {
          step.isFinal ? '🚨 РЕГЛАМЕНТ ДЕЙСТВИЙ:' : 'ℹ️ ПОРЯДОК ДЕЙСТВИЙ:'
        } < /strong><br>;
        html += step.text.replace(/\n/g, "
          ");
          html += < /div>;
        }
        else {
          html += < div class = "main-text" > $ {
            step.text
          } < /div>;
        }
        html += < div class = "buttons-container" > ;
        if (step.options && step.options.length > 0) {
          step.options.forEach(opt => {
            html += < button class =
              "btn ${opt.text.includes('🚨') || opt.text.includes('критический') ? 'btn-danger' : ''} ${opt.text.includes('⚠️') ? 'btn-warning' : ''}"
            onclick =
              "selectOption('${opt.next}', '${step.history || ''}')" > $ {
                opt.text
              } < /button>;
          });
        } else {
          html += < p style =
            "text-align:center; color:var(--success-color); font-weight:bold; margin: 10px 0 0 0;" >
            ⚙️Алгоритм по инструкции исчерпан < /p>;
        }
        html += < /div>;
        card.innerHTML = html;
      }

      function selectOption(nextStep, historyText) {
        if (historyText && !pathHistory.includes(historyText)) {
          pathHistory.push(historyText);
        }
        // Специальный хак для первой ветки (добавление в историю Невы/Юбилейного)
        if (currentStep === 'start') {
          if (nextStep === 'neva_main') pathHistory = ["НЕВА"];
          if (nextStep === 'jub_main') pathHistory = ["ЮБИЛЕЙНЫЙ"];
        }
        currentStep = nextStep;
        renderStep();
      }

      function goBack() {
        if (currentStep === 'start') return;
        // Поиск родительского шага
        let parentStep = 'start';
        for (let key in database) {
          if (database[key].options) {
            const hasChild = database[key].options.some(o => optToKey(o
              .next) === currentStep);
            if (hasChild) {
              parentStep = key;
              break;
            }
          }
        }
        if (parentStep === 'start') {
          pathHistory = [];
        } else {
          pathHistory.pop();
        }
        currentStep = parentStep;
        renderStep();
      }

      function optToKey(next) {
        return next;
      }

      function resetFlow() {
        currentStep = 'start';
        pathHistory = [];
        renderStep();
      }
      // Запуск приложения
      renderStep();
